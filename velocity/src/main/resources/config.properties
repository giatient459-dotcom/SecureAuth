# SecureAuthVelocity 1.0.1
# File này được copy ra plugins/secureauth-velocity/config.properties khi chạy lần đầu.

# HTTP notify server (Paper POST /auth/notify vào đây)
# Nên KHÁC port plugin-http-port của Paper bot (thường Paper bot = 20334)
http-port=20335
http-bind=127.0.0.1

# Shared secret — phải khớp velocity.backend-secret bên Paper config.yml
backend-secret=CHANGE_ME_SAME_AS_PAPER_SECRET

# Server cho phép vào khi CHƯA auth (lobby/auth). Khớp tên trong velocity.toml
# Để trống = chặn mọi server cho đến khi Paper notify
auth-server=lobby

# Session proxy hết hạn (giây). 0 = chỉ xóa khi disconnect
session-timeout-seconds=3600
