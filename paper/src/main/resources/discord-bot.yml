# SecureAuth — discord-bot.yml
# Tách từ config.yml — sửa file này rồi /reload hoặc restart

discord-bot:
  api-url: "http://127.0.0.1:8765"
  api-secret: "CHANGE_ME_STRONG_SECRET"
  api-timeout-ms: 5000
  # Cổng HTTP mà plugin lắng nghe để bot gọi vào (verify-credentials, discord-status)
  plugin-http-port: 20334

