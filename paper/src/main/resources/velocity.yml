# SecureAuth — velocity.yml
# Tách từ config.yml — sửa file này rồi /reload hoặc restart

velocity:
  # URL endpoint của Velocity plugin để báo login thành công
  # Phải khớp với api-host và api-port trong config Velocity
  # Để trống ("") nếu không dùng Velocity
  notify-url: "http://127.0.0.1:20334/auth/notify"
  # Phải giống backend-secret trong config Velocity
  backend-secret: "CHANGE_ME_SAME_AS_VELOCITY_SECRET"


# Sao lưu SQLite tự động (0 = tắt lịch, vẫn dùng /authadmin backup)
