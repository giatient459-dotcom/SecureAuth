# ============================================================
# SecureAuth — config.yml (đầy đủ)
# SQLite: plugins/SecureAuth/secureauth.db (tự tạo)
# Lang: plugins/SecureAuth/lang/en.yml | vi.yml
# Sau khi sửa: /authadmin reload (hoặc restart)
# ============================================================

# Ngôn ngữ tin nhắn: en | vi
locale: en

# ------------------------------------------------------------
# Bảo mật / đăng nhập
# ------------------------------------------------------------
security:
  # Giây chờ login trước khi kick (chưa đăng nhập)
  session-timeout: 300

  # Gắn session với IP lúc login (chống session hijack). Nên để true
  bind-session-ip: true

  # Timeout AFK sau khi đã login (giây). 0 = tắt. 1800 = 30 phút
  session-idle-timeout: 1800

  # Đếm ngược action bar khi chưa login
  login-countdown-actionbar: true

  # Giây “ân hạn” sau login (tránh kick/TP khi lag)
  login-grace-seconds: 3

  # Sai mật khẩu / 2FA quá số lần → khóa tạm
  max-login-attempts: 5
  lockout-duration: 300

  # Giới hạn đăng ký theo IP
  max-accounts-per-ip: 3
  register-attempts-per-10min: 5
  link-attempts-per-10min: 10

  # Captcha toán đơn giản khi /register (true = bật)
  register-captcha: false

  password:
    min-length: 8
    # true = bắt buộc có chữ hoa + số
    require-mixed: false

  # Nhớ IP X giờ → bỏ qua 2FA (cùng IP)
  ip-session:
    enabled: true
    hours: 72
    # Discord nút Xác nhận / Từ chối khi IP mới
    confirm-buttons: true
    confirm-expiry-seconds: 300

  # Mã 2FA Discord DM
  two-fa-code-expiry: 120
  two-fa-code-length: 6
  two-fa-min-resend-interval: 15

  # true = tài khoản premium (online UUID) + đã register → auto-login
  premium-auto-login: false

  # Argon2 — không đổi trừ khi hiểu rõ
  argon2-iterations: 3
  argon2-memory-kb: 65536
  argon2-parallelism: 4

# ------------------------------------------------------------
# Discord bot (2FA)
# api-url     = Paper gọi BOT
# plugin-http = BOT gọi Paper (approve IP, v.v.)
# api-secret  phải khớp với bot
# ------------------------------------------------------------
discord-bot:
  api-url: "http://127.0.0.1:8765"
  api-secret: "CHANGE_ME_STRONG_SECRET"
  api-timeout-ms: 5000
  plugin-http-port: 20334
  # 127.0.0.1 = chỉ local | 0.0.0.0 = bot remote (cần secret mạnh + firewall)
  plugin-http-bind: "127.0.0.1"

# ------------------------------------------------------------
# Login lobby — đứng chỗ muốn rồi /authsetspawn
# (hoặc điền world + tọa độ thủ công)
# ------------------------------------------------------------
login-world:
  world: ""
  end-world: ""
  x: 0.5
  y: 64.0
  z: 0.5
  yaw: 0.0
  pitch: 0.0

# ------------------------------------------------------------
# Velocity / BungeeCord companion
# Paper POST notify sau login (HMAC + ts + nonce chống replay)
# notify-url trống = không dùng proxy auth bridge
# backend-secret phải GIỐNG config Velocity/Bungee
# ------------------------------------------------------------
velocity:
  notify-url: "http://127.0.0.1:20334/auth/notify"
  backend-secret: "CHANGE_ME_SAME_AS_VELOCITY_SECRET"

# ------------------------------------------------------------
# Backup SQLite
# ------------------------------------------------------------
backup:
  interval-hours: 24
  keep-count: 7

# ------------------------------------------------------------
# Discord webhook (cảnh báo lockout / admin)
# ------------------------------------------------------------
alerts:
  webhook-enabled: false
  discord-webhook-url: ""

# ------------------------------------------------------------
# Chặn OP / lệnh nguy hiểm
# ------------------------------------------------------------
op-guard:
  block-op-commands: true
  block-bypass-grants: true

dangerous-commands:
  enabled: true
  extra-protected: []
  console-only:
    - "stop"
    - "restart"
    - "reload"

# ------------------------------------------------------------
# bStats 
# ------------------------------------------------------------
metrics:
  enabled: true

# ------------------------------------------------------------
# ProtocolLib soft-depend (chặn packet lệnh/tab khi chưa login)
# Không cài ProtocolLib → plugin vẫn chạy bình thường
# ------------------------------------------------------------
protocolib:
  enabled: true

# ------------------------------------------------------------
# Ghi đè message (ưu tiên sửa lang/en.yml hoặc lang/vi.yml)
# Key có trong messages. sẽ override file lang
# ------------------------------------------------------------
messages: {}
