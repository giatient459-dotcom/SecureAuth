# ============================================================
# SecureAuth — config.yml (full)
# SQLite: plugins/SecureAuth/secureauth.db (auto-created)
# Lang: plugins/SecureAuth/lang/en.yml | vi.yml
# After edit: /authadmin reload (or restart)
# ============================================================

# Message language: en | vi
locale: en

# ------------------------------------------------------------
# Security / login
# ------------------------------------------------------------
security:
  # Seconds to wait for login before kick (not logged in yet)
  session-timeout: 300

  # Bind in-memory session to login IP (anti session-hijack). Keep true
  bind-session-ip: true

  # AFK timeout after successful login (seconds). 0 = off. 1800 = 30 min
  session-idle-timeout: 1800

  # Action-bar countdown while not logged in
  login-countdown-actionbar: true

  # Grace seconds after login (avoid kick/TP on lag)
  login-grace-seconds: 3

  # Wrong password / 2FA too many times → temporary lockout
  max-login-attempts: 5
  lockout-duration: 300

  # Register limits per IP
  max-accounts-per-ip: 3
  register-attempts-per-10min: 5
  link-attempts-per-10min: 10

  # Simple math captcha on /register (TTL 5 min, max 3 tries when enabled)
  register-captcha: false

  password:
    min-length: 10
    # true = require letters + digits (and upper+lower when length >= 12)
    require-mixed: true
    # 0 = off; 40–50 = stronger entropy check (PasswordPolicy)
    min-entropy-bits: 40

  # Remember IP for X hours → skip 2FA (same IP)
  ip-session:
    enabled: true
    hours: 72
    # Discord Confirm / Deny buttons on new IP
    confirm-buttons: true
    confirm-expiry-seconds: 300

  # Discord DM 2FA codes (runtime clamps length to min 8)
  two-fa-code-expiry: 120
  two-fa-code-length: 8
  two-fa-min-resend-interval: 15

  # true = premium (online UUID) + registered → auto-login
  premium-auto-login: false

  # Argon2 — do not change unless you know what you are doing
  argon2-iterations: 3
  argon2-memory-kb: 65536
  argon2-parallelism: 4

# ------------------------------------------------------------
# Discord bot (2FA)
# api-url     = Paper → BOT
# plugin-http = BOT → Paper (IP approve, etc.)
# api-secret must match the bot
# Prefer https:// for remote hosts (HTTP only OK for 127.0.0.1)
# ------------------------------------------------------------
discord-bot:
  api-url: "http://127.0.0.1:8765"
  api-secret: "CHANGE_ME_STRONG_SECRET"
  api-timeout-ms: 5000
  plugin-http-port: 20334
  # 127.0.0.1 = local only | 0.0.0.0 = remote bot (strong secret + firewall)
  plugin-http-bind: "127.0.0.1"

# ------------------------------------------------------------
# Login lobby — stand there and /authsetspawn
# (or fill world + coordinates manually)
# ------------------------------------------------------------
login-world:
  world: ""
  end-world: ""
  x: 0.5
  y: 64.0
  z: 0.5
  yaw: 0.0
  pitch: 0.0

# ------------------------------------------------------------
# Velocity / BungeeCord companion
# Paper POST /auth/notify after login (HMAC + ts + nonce anti-replay)
# Empty notify-url = no proxy auth bridge
# backend-secret MUST match Velocity/Bungee config
# ------------------------------------------------------------
velocity:
  notify-url: "http://127.0.0.1:20334/auth/notify"
  backend-secret: "CHANGE_ME_SAME_AS_VELOCITY_SECRET"

# ------------------------------------------------------------
# SQLite backup
# ------------------------------------------------------------
backup:
  interval-hours: 24
  keep-count: 7

# ------------------------------------------------------------
# Discord webhook (lockout / admin alerts)
# ------------------------------------------------------------
alerts:
  webhook-enabled: false
  discord-webhook-url: ""

# ------------------------------------------------------------
# OP / dangerous command guards
# ------------------------------------------------------------
op-guard:
  block-op-commands: true
  block-bypass-grants: true

dangerous-commands:
  enabled: true
  extra-protected: []
  console-only:
    - "stop"
    - "restart"
    - "reload"

# ------------------------------------------------------------
# bStats (plugin id hardcoded in jar — enable/disable only)
# ------------------------------------------------------------
metrics:
  enabled: true

# ------------------------------------------------------------
# ProtocolLib soft-depend (block command/tab packets pre-login)
# No ProtocolLib installed → plugin still runs normally
# ------------------------------------------------------------
protocolib:
  enabled: true

# ------------------------------------------------------------
# Message overrides (prefer editing lang/en.yml or lang/vi.yml)
# Keys under messages. override the lang file for that key only
# ------------------------------------------------------------
messages: {}
