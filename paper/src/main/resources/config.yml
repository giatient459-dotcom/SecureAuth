# ============================================================
# SecureAuth — config.yml
# SQLite: plugins/SecureAuth/secureauth.db (auto-created)
# Change only what you need; leave advanced keys at defaults.
# ============================================================

# Language: en | vi  (files: plugins/SecureAuth/lang/<locale>.yml)
locale: en

# --- Login / security ---
security:
  # Seconds to wait for login before kick
  session-timeout: 300
  # Show countdown on action bar
  login-countdown-actionbar: true
  # Grace seconds after login (avoid kick/TP on lag)
  login-grace-seconds: 3

  max-login-attempts: 5
  lockout-duration: 300
  max-accounts-per-ip: 3
  register-attempts-per-10min: 5
  link-attempts-per-10min: 10
  register-captcha: false

  password:
    min-length: 8
    require-mixed: false

  # Skip 2FA if same IP within X hours
  ip-session:
    enabled: true
    hours: 72
    confirm-buttons: true
    confirm-expiry-seconds: 300

  two-fa-code-expiry: 120
  two-fa-code-length: 6
  two-fa-min-resend-interval: 15

  # true = premium (online UUID) + registered → auto-login
  premium-auto-login: false

  # Argon2 — do not change unless you know what you are doing
  argon2-iterations: 3
  argon2-memory-kb: 65536
  argon2-parallelism: 4

# --- Discord bot (2FA) ---
# api-url = plugin calls bot; plugin-http-* = bot calls plugin
discord-bot:
  api-url: "http://127.0.0.1:8765"
  api-secret: "CHANGE_ME_STRONG_SECRET"
  api-timeout-ms: 5000
  # Plugin HTTP port (bot calls in)
  plugin-http-port: 20334
  # 127.0.0.1 = local only | 0.0.0.0 = remote bot (strong api-secret + firewall required)
  plugin-http-bind: "127.0.0.1"

# --- Login lobby (stand there → /authsetspawn) ---
login-world:
  world: ""
  end-world: ""
  x: 0.5
  y: 64.0
  z: 0.5
  yaw: 0.0
  pitch: 0.0

# --- Velocity (leave notify-url empty if unused) ---
velocity:
  notify-url: "http://127.0.0.1:20334/auth/notify"
  backend-secret: "CHANGE_ME_SAME_AS_VELOCITY_SECRET"

# --- Database backup ---
backup:
  interval-hours: 24
  keep-count: 7

# --- Discord webhook (lockout / admin alerts) ---
alerts:
  webhook-enabled: false
  discord-webhook-url: ""

# --- OP / dangerous command guards ---
op-guard:
  block-op-commands: true
  block-bypass-grants: true

dangerous-commands:
  enabled: true
  extra-protected: []
  console-only:
    - "stop"
    - "restart"
    - "reload"
  # examples of other protected groups are handled in code permissions

# --- bStats (plugin id 34505 is hardcoded) ---
metrics:
  enabled: true

# --- ProtocolLib (optional soft-depend) ---
protocolib:
  enabled: true

# --- Optional message overrides (prefer editing lang/en.yml or lang/vi.yml) ---
# If a key exists here under messages., it overrides the lang file for that key only.
messages: {}
