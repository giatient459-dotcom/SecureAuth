# ============================================================
# SecureAuth — config.yml
# SQLite: plugins/SecureAuth/secureauth.db (tự tạo)
# Chỉ sửa phần bạn cần. Key nâng cao để mặc định.
# ============================================================

# --- Đăng nhập / bảo mật ---
security:
  # Giây chờ login trước khi kick
  session-timeout: 300
  # Hiện đếm ngược trên action bar
  login-countdown-actionbar: true
  # Giây "ân hạn" sau login (tránh kick/TP khi lag)
  login-grace-seconds: 3

  max-login-attempts: 5
  lockout-duration: 300
  max-accounts-per-ip: 3
  register-attempts-per-10min: 5
  link-attempts-per-10min: 10
  register-captcha: false

  password:
    min-length: 8
    require-mixed: false

  # Bỏ qua 2FA nếu cùng IP trong X giờ
  ip-session:
    enabled: true
    hours: 72
    confirm-buttons: true
    confirm-expiry-seconds: 300

  two-fa-code-expiry: 120
  two-fa-code-length: 6
  two-fa-min-resend-interval: 15

  # true = acc premium (online UUID) đã register → tự login
  kick-2fa-dm-failed: "&cKhông gửi được mã 2FA Discord. Thử lại sau."
  kick-ip-denied: "&cIP bị từ chối trên Discord."
  link-rate-limited: "&cLink quá nhiều. Thử lại sau."
  password-weak: "&cMật khẩu cần chữ và số (theo config)."
  premium-auto-login: false

  # Argon2 — đừng đổi nếu không biết
  argon2-iterations: 3
  argon2-memory-kb: 65536
  argon2-parallelism: 4

# --- Discord bot (2FA) ---
# api-url = bot gọi ra; plugin-http-port = bot gọi vào plugin
discord-bot:
  api-url: "http://127.0.0.1:8765"
  api-secret: "CHANGE_ME_STRONG_SECRET"
  api-timeout-ms: 5000
  plugin-http-port: 20334

# --- Lobby chưa login (đứng chỗ → /authsetspawn) ---
login-world:
  world: ""
  end-world: ""
  x: 0.5
  y: 64.0
  z: 0.5
  yaw: 0.0
  pitch: 0.0

# --- Velocity (để trống notify-url nếu không dùng) ---
velocity:
  notify-url: "http://127.0.0.1:20334/auth/notify"
  backend-secret: "CHANGE_ME_SAME_AS_VELOCITY_SECRET"

# --- Sao lưu DB ---
backup:
  interval-hours: 24
  keep-count: 7

# --- Webhook Discord (lockout / admin) ---
alerts:
  webhook-enabled: false
  discord-webhook-url: ""



# --- Chặn OP / lệnh nguy hiểm ---
op-guard:
  block-op-commands: true
  block-bypass-grants: true

dangerous-commands:
  enabled: true
  extra-protected: []
  console-only:
    - "stop"
    - "restart"

command-blocker:
  enabled: true
  message: "&cUnknown command. Type /help for help."
  blocked:
    - "gamemode"
    - "gm"
    - "tp"
    - "tphere"
    - "teleport"
    - "give"
    - "enchant"
    - "effect"
    - "kill"
    - "summon"
    - "setblock"
    - "fill"
    - "time"
    - "weather"
    - "difficulty"
    - "spawnpoint"
    - "xp"
    - "experience"
    - "attribute"
    - "ban"
    - "ban-ip"
    - "kick"
    - "pardon"
    - "pardon-ip"
    - "whitelist"


# --- bStats  ---
metrics:
  enabled: true

