# SecureAuth — security.yml
# Tách từ config.yml — sửa file này rồi /reload hoặc restart

security:
  session-timeout: 300
  max-login-attempts: 5
  # Số account tối đa được đăng ký từ 1 IP (0 = không giới hạn)
  max-accounts-per-ip: 3
  lockout-duration: 300
  two-fa-code-expiry: 120
  two-fa-code-length: 6
  two-fa-min-resend-interval: 15
  register-attempts-per-10min: 5
  link-attempts-per-10min: 10
  argon2-iterations: 3
  argon2-memory-kb: 65536
  argon2-parallelism: 4
  # Nhớ IP sau login thành công — bỏ qua 2FA trong X giờ nếu cùng IP
  ip-session:
    enabled: true
    hours: 72
    # IP mới → bot Discord gửi nút Xác nhận / Từ chối (cần bot hỗ trợ endpoint)
    confirm-buttons: true
    confirm-expiry-seconds: 300
  # Yêu cầu mật khẩu có chữ + số (bật nếu muốn chặt hơn)
  password:
    min-length: 8
    require-mixed: false
  # Captcha toán đơn giản khi /register (a+b=?)
  register-captcha: false
  # Grace period sau login (giây) — tránh kick/teleport race khi lag
  login-grace-seconds: 3

