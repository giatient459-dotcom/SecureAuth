name: SecureAuth
version: '${project.version}'
main: dev.tienday.secureauth.SecureAuthPlugin
api-version: '1.20'
description: Secure login system with 2FA via Discord
author: TienDay
load: POSTWORLD

commands:
  login:
    description: Đăng nhập để vô server MeoDenMC
    usage: /dn <mật khẩu> [2fa_code]
    aliases: [l]
  register:
    description: Đăng Ký Tài Khoản
    usage: /dk <mật khẩu> <xác nhận mật khẩu>
    aliases: [reg]
  link:
    description: Liên kết tài khoản (Dùng code từ bot 2FA)
    usage: /liên kết <mã>
  changepassword:
    description: Đổi mật khẩu
    usage: /changepassword <cũ> <mới> <xác nhận>
    aliases: [cp, passwd]

  uuid:
    description: Hiện cái Minecraft UUID của bạn
    usage: /uuid

  authsetspawn:
    description: Để chỗ cho người dùng chưa login
    usage: /authsetspawn
    permission: secureauth.admin

  authadmin:
    description: Admin commands for SecureAuth
    usage: /authadmin <reset|resetfa|info|list|search|logs|backup> ...
    permission: secureauth.admin
    permission-message: "&cNo permission."

permissions:
  secureauth.admin:
    description: Access to /authadmin commands
    default: false

  secureauth.force2fa:
    description: Always require Discord 2FA (staff) — ignores IP session skip
    default: false

  secureauth.bypass:
    description: Bypass login requirement — NEVER grant to OP automatically
    default: false

  secureauth.manage-op:
    description: Allow using /op and /deop in-game (still logged)
    default: false

  secureauth.cmd.server-control:
    description: Allow /reload /timings (NOT /stop /restart — console only)
    default: false

  secureauth.cmd.plugin-manage:
    description: Allow /plugins /pl /version /plugman
    default: false

  secureauth.cmd.world-manage:
    description: Allow /save-all /save-off /whitelist /unload
    default: false

  secureauth.cmd.console-exec:
    description: Allow /execute /sudo and console-level commands
    default: false
