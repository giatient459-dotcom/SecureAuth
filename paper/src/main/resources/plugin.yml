op-guard:
  block-op-commands: true
  block-bypass-grants: true

dangerous-commands:
  enabled: true
  extra-protected: []
  console-only:
    - "stop"
    - "restart"

command-blocker:
  enabled: true
  # Tin nhắn hiện ra khi bị chặn (giả vờ như command không tồn tại)
  message: "&cUnknown command. Type /help for help."
  # Danh sách command bị chặn với non-OP (không cần ghi dấu /)
  blocked:
    - "gamemode"
    - "gm"
    - "tp"
    - "tphere"
    - "teleport"
    - "give"
    - "enchant"
    - "effect"
    - "kill"
    - "summon"
    - "setblock"
    - "fill"
    - "time"
    - "weather"
    - "difficulty"
    - "spawnpoint"
    - "xp"
    - "experience"
    - "attribute"
    - "ban"
    - "ban-ip"
    - "kick"
    - "pardon"
    - "pardon-ip"
    - "whitelist"

login-world:
  # Tên world The End để tp player chưa login vào đây
  # Mặc định Paper: world_the_end
  end-world: "world_the_end"
  # Toạ độ spawn trong End (mặc định: 0 64 0 — giữa đảo End)
  x: 0.5
  y: 64.0
  z: 0.5
  yaw: 0.0
  pitch: 0.0

# Velocity integration (để trống nếu không dùng proxy)
velocity:
  # URL endpoint của Velocity plugin để báo login thành công
  # Phải khớp với api-host và api-port trong config Velocity
  # Để trống ("") nếu không dùng Velocity
  notify-url: "http://127.0.0.1:20334/auth/notify"
  # Phải giống backend-secret trong config Velocity
  backend-secret: "CHANGE_ME_SAME_AS_VELOCITY_SECRET"


# Sao lưu SQLite tự động (0 = tắt lịch, vẫn dùng /authadmin backup)
backup:
  interval-hours: 24
  keep-count: 7

# Cảnh báo Discord webhook khi lockout / admin action
alerts:
  webhook-enabled: false
  discord-webhook-url: ""
