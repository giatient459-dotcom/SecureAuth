# SecureAuth Configuration
# Author: TienDay

# SQLite — không cần cài gì thêm, file tự tạo tại plugins/SecureAuth/secureauth.db

security:
  # Thời gian chờ login khi vừa vào server (giây) — hết hạn thì kick
  session-timeout: 180
  max-login-attempts: 5
  # Số account tối đa được đăng ký từ 1 IP (0 = không giới hạn)
  max-accounts-per-ip: 3
  lockout-duration: 300
  two-fa-code-expiry: 120
  two-fa-code-length: 6
  two-fa-min-resend-interval: 15
  register-attempts-per-10min: 5
  link-attempts-per-10min: 10
  argon2-iterations: 3
  argon2-memory-kb: 65536
  argon2-parallelism: 4
  # Premium (tài khoản thật) tự login — bỏ password
  premium-auto-login: true
  # Premium vẫn cần 2FA khi IP mới (khuyên true)
  premium-require-2fa: true
  # Nhớ IP sau login thành công — bỏ qua 2FA trong X giờ nếu cùng IP
  ip-session:
    enabled: true
    hours: 72
    # IP mới → gửi Discord nút Xác nhận / Từ chối (không gõ /login mã)
    confirm-buttons: true
    confirm-expiry-seconds: 120
  # Yêu cầu mật khẩu có chữ + số (bật nếu muốn chặt hơn)
  password:
    min-length: 8
    require-mixed: false
  # Captcha toán đơn giản khi /register (a+b=?)
  register-captcha: false
  # Grace period sau login (giây) — tránh kick/teleport race khi lag
  login-grace-seconds: 3

discord-bot:
  api-url: "http://127.0.0.1:8765"
  api-secret: "CHANGE_ME_STRONG_SECRET"
  api-timeout-ms: 5000
  # Cổng HTTP mà plugin lắng nghe để bot gọi vào (verify-credentials, discord-status)
  plugin-http-port: 20334

