name: SecureAuth
version: '${version}'
main: dev.tienday.secureauth.SecureAuthPlugin
api-version: '1.21'
description: Secure login system with 2FA via Discord
author: TienDay
load: POSTWORLD

commands:
  login:
    description: Login to the server
    usage: /login <password> [2fa_code]
    aliases: [l]
  register:
    description: Register an account
    usage: /register <password> <confirm_password>
    aliases: [reg]
  link:
    description: Link your Discord account
    usage: /link <code>
  uuid:
    description: Show your Minecraft UUID
    usage: /uuid
  authsetspawn:
    description: Set the login spawn location
    usage: /authsetspawn
    permission: secureauth.admin
  authadmin:
    description: Admin commands for SecureAuth
    usage: /authadmin <reset|resetfa|info> <player>
    permission: secureauth.admin
    permission-message: "&cNo permission."

permissions:
  secureauth.admin:
    description: Access to /authadmin
    default: false
  secureauth.bypass:
    description: Bypass login requirement
    default: false
  secureauth.manage-op:
    description: Allow /op and /deop in-game
    default: false
  secureauth.cmd.server-control:
    description: Allow /reload /timings
    default: false
  secureauth.cmd.plugin-manage:
    description: Allow /plugins /pl /version
    default: false
  secureauth.cmd.world-manage:
    description: Allow /save-all /whitelist
    default: false
  secureauth.cmd.console-exec:
    description: Allow /execute /sudo
    default: false
