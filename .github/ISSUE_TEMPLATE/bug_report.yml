name: Bug report
description: Report a bug in the SecureAuth plugin (Paper / Velocity)
title: "[Bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for reporting a bug. Filling in all the information helps us fix it faster.
  - type: dropdown
    id: component
    attributes:
      label: Component
      description: Where does the bug occur?
      options:
        - Paper plugin
        - Velocity plugin
        - Discord bot / HTTP API
        - Not sure
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Plugin version
      description: Example 1.0.2 (from /plugins or plugin.yml)
      placeholder: "1.0.2"
    validations:
      required: true
  - type: input
    id: server
    attributes:
      label: Server / proxy
      description: Paper/Purpur version, Velocity version (if applicable)
      placeholder: "Paper 1.21.4, Velocity 3.4.0"
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Steps to trigger the bug
      placeholder: |
        1. Join server
        2. /login ...
        3. ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      placeholder: What should have happened
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      placeholder: What is happening (include screenshots if available)
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs / stack trace
      description: Paste console logs (redact secrets, tokens, webhooks)
      render: shell
  - type: checkboxes
    id: checklist
    attributes:
      label: Checklist
      options:
        - label: I have read the README / config.yml
          required: true
        - label: I have tried restarting the server after changing the config
          required: false
        - label: I did not paste API secrets / webhook URLs into the issue
          required: true
