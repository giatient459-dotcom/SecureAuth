name: Xin làm Tester
description: Đăng ký test SecureAuth (Paper / Velocity / bot)
title: "[Tester] "
labels: ["tester"]
body:
  - type: markdown
    attributes:
      value: |
        Đăng ký tham gia test build. Không cần kinh nghiệm lập trình, cần server thử hoặc sẵn sàng report bug rõ ràng.
  - type: input
    id: discord
    attributes:
      label: Discord
      description: Username Discord (để liên lạc)
      placeholder: "name hoặc name#0000"
    validations:
      required: true
  - type: dropdown
    id: experience
    attributes:
      label: Kinh nghiệm
      options:
        - Mới chơi / mới setup server
        - Đã từng dùng AuthMe / nLogin / tương tự
        - Admin server / biết Paper + proxy
    validations:
      required: true
  - type: dropdown
    id: can_test
    attributes:
      label: Có thể test
      multiple: true
      options:
        - Paper only (không proxy)
        - Paper + Velocity
        - Discord 2FA / bot HTTP
        - Online-mode / premium
        - Offline-mode / cracked
    validations:
      required: true
  - type: input
    id: mc_version
    attributes:
      label: Version Minecraft server của bạn
      placeholder: "1.21.4"
    validations:
      required: true
  - type: textarea
    id: note
    attributes:
      label: Ghi chú thêm
      placeholder: Thời gian rảnh, số slot test, v.v.
  - type: checkboxes
    id: agree
    attributes:
      label: Cam kết
      options:
        - label: Sẽ báo bug bằng issue template Bug report (không spam DM không rõ ràng)
          required: true
        - label: Không chia sẻ bản pre-release công khai nếu được yêu cầu giữ kín
          required: true
