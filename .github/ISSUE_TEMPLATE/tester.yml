name: Apply to be a Tester
description: Register to test SecureAuth (Paper / Velocity / bot)
title: "[Tester] "
labels: ["tester"]
body:
  - type: markdown
    attributes:
      value: |
        Register to join the test build. No programming experience required — you need a test server or be ready to report bugs clearly.
  - type: input
    id: discord
    attributes:
      label: Discord
      description: Discord username (for contact)
      placeholder: "name or name#0000"
    validations:
      required: true
  - type: dropdown
    id: experience
    attributes:
      label: Experience
      options:
        - New to playing / new to server setup
        - Have used AuthMe / nLogin / similar
        - Server admin / familiar with Paper + proxy
    validations:
      required: true
  - type: dropdown
    id: can_test
    attributes:
      label: Can test
      multiple: true
      options:
        - Paper only (no proxy)
        - Paper + Velocity
        - Discord 2FA / bot HTTP
        - Online-mode / premium
        - Offline-mode / cracked
    validations:
      required: true
  - type: input
    id: mc_version
    attributes:
      label: Your Minecraft server version
      placeholder: "1.21.4"
    validations:
      required: true
  - type: textarea
    id: note
    attributes:
      label: Additional notes
      placeholder: Free time, number of test slots, etc.
  - type: checkboxes
    id: agree
    attributes:
      label: Commitment
      options:
        - label: Will report bugs using the Bug report issue template (no unclear DM spam)
          required: true
        - label: Will not share the pre-release build publicly if asked to keep it confidential
          required: true
