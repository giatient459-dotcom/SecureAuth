name: E2E Test — Mineflayer Bot

on:
  workflow_dispatch:
    inputs:
      mc_version:
        description: 'Paper version'
        required: true
        default: '1.21.4'
      bot_username:
        description: 'Bot username'
        required: true
        default: 'TestBot'
      test_password:
        description: 'Test password'
        required: true
        default: 'SecurePass123!'
  pull_request:
    branches: [monorepo-fix]
  push:
    branches: [monorepo-fix, main, master]
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: secureauth-e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    name: Paper ${{ inputs.mc_version || '1.21.4' }} + Bot
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          java-version: '21'
          distribution: temurin
          cache: maven

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      # ───────────────────────────────────────────────────────
      # 1. Build plugin
      # ───────────────────────────────────────────────────────
      - name: Build SecureAuth plugin
        run: mvn -B clean verify --no-transfer-progress

      # ───────────────────────────────────────────────────────
      # 2. Setup test server
      # ───────────────────────────────────────────────────────
      - name: Prepare test server directory
        run: |
          mkdir -p test-server/plugins
          cd test-server
          echo "eula=true" > eula.txt

          cat > server.properties <<EOF
          online-mode=false
          max-players=10
          view-distance=4
          simulation-distance=4
          spawn-protection=0
          level-type=flat
          level-name=world
          motd=SecureAuth E2E
          enable-query=false
          disable-chat-reports=true
          allow-flight=true
          spawn-monsters=false
          difficulty=peaceful
          gamemode=adventure
          EOF

          echo "✅ Test server prepared"

      # ───────────────────────────────────────────────────────
      # 3. Download Paper server
      # ───────────────────────────────────────────────────────
      - name: Download Paper server
        env:
          MC_VERSION: ${{ inputs.mc_version || '1.21.4' }}
        run: |
          cd test-server

          JAR_URL=""

          echo "=== Trying API v3 ==="
          V3_JSON=$(curl -s "https://api.papermc.io/v3/projects/paper/versions/${MC_VERSION}/builds" || echo "[]")
          echo "v3 preview: $(echo "$V3_JSON" | head -c 200)"

          if echo "$V3_JSON" | python3 -c "import sys,json; d=json.load(sys.stdin); exit(0 if isinstance(d,list) and len(d)>0 else 1)" 2>/dev/null; then
            JAR_URL=$(echo "$V3_JSON" | python3 -c "
          import sys, json
          d = json.load(sys.stdin)
          build = d[0]
          downloads = build.get('downloads', {})
          if not downloads:
              exit(1)
          key = 'server:default' if 'server:default' in downloads else list(downloads.keys())[0]
          print(downloads[key]['url'])
          ")
            echo "✅ API v3 works"
          fi

          if [ -z "$JAR_URL" ]; then
            echo "=== Falling back to API v2 ==="
            V2_JSON=$(curl -s "https://api.papermc.io/v2/projects/paper/versions/${MC_VERSION}/builds" || echo "{}")
            if echo "$V2_JSON" | python3 -c "import sys,json; d=json.load(sys.stdin); exit(0 if 'builds' in d and len(d['builds'])>0 else 1)" 2>/dev/null; then
              BUILD=$(echo "$V2_JSON" | python3 -c "import sys,json; print(json.load(sys.stdin)['builds'][-1]['build'])")
              JAR_URL="https://api.papermc.io/v2/projects/paper/versions/${MC_VERSION}/builds/${BUILD}/downloads/paper-${MC_VERSION}-${BUILD}.jar"
              echo "✅ API v2 works (build $BUILD)"
            fi
          fi

          if [ -z "$JAR_URL" ]; then
            echo "=== Fallback to Purpur ==="
            JAR_URL="https://api.purpurmc.org/v2/purpur/${MC_VERSION}/latest/download"
          fi

          curl -sSL -o paper.jar "$JAR_URL"
          ls -lh paper.jar
          file paper.jar | grep -qE "Java archive|Zip archive" || { echo "❌ Invalid JAR"; exit 1; }
          echo "✅ Paper downloaded"

      # ───────────────────────────────────────────────────────
      # 4. Install plugin
      # ───────────────────────────────────────────────────────
      - name: Install SecureAuth
        run: |
          cp paper/target/SecureAuth-*.jar test-server/plugins/
          ls -lh test-server/plugins/

      # ───────────────────────────────────────────────────────
      # 5. Reset database (tránh account đã tồn tại)
      # ───────────────────────────────────────────────────────
      - name: Reset database
        run: |
          rm -f test-server/plugins/SecureAuth/*.db || true
          rm -f test-server/plugins/SecureAuth/*.db-shm || true
          rm -f test-server/plugins/SecureAuth/*.db-wal || true
          echo "✅ Database reset"

      # ───────────────────────────────────────────────────────
      # 6. Start Paper server
      # ───────────────────────────────────────────────────────
      - name: Start Paper server
        run: |
          cd test-server
          nohup java -Xmx2G -jar paper.jar nogui > server.log 2>&1 &
          echo $! > server.pid
          echo "Server PID: $(cat server.pid)"

          echo "Waiting for server ready..."
          for i in $(seq 1 90); do
            if grep -q "Done (" server.log 2>/dev/null; then
              echo "✅ Server ready after ${i}s"
              break
            fi
            if ! kill -0 $(cat server.pid) 2>/dev/null; then
              echo "❌ Server crashed!"
              cat server.log
              exit 1
            fi
            sleep 2
          done

          if ! grep -q "Done (" server.log; then
            echo "❌ Server did not start"
            cat server.log
            exit 1
          fi

          if grep -q "SecureAuth" server.log; then
            echo "✅ Plugin loaded"
            grep "SecureAuth" server.log | head -10
          else
            echo "❌ Plugin NOT loaded!"
            cat server.log
            exit 1
          fi

      # ───────────────────────────────────────────────────────
      # 7. Install Mineflayer
      # ───────────────────────────────────────────────────────
      - name: Install Mineflayer
        run: |
          cd test-server
          npm init -y > /dev/null
          npm install mineflayer@4 --silent
          echo "✅ Mineflayer installed"

      # ───────────────────────────────────────────────────────
      # 8. Create bot test script (FIXED)
      # ───────────────────────────────────────────────────────
      - name: Create bot test script
        run: |
          cat > test-server/bot-test.js <<'BOTEOF'
          const mineflayer = require('mineflayer');

          const MC_HOST = '127.0.0.1';
          const MC_PORT = 25565;
          const BOT_USERNAME = process.env.BOT_USERNAME || 'TestBot';
          const TEST_PASSWORD = process.env.TEST_PASSWORD || 'SecurePass123!';

          const steps = [
            {
              name: 'register',
              chat: `/register ${TEST_PASSWORD} ${TEST_PASSWORD}`,
              wait: /Registered successfully|Đăng ký thành công/i,
              timeout: 15000
            },
            {
              name: 'login',
              chat: `/login ${TEST_PASSWORD}`,
              wait: /Wrong password|Sai mật khẩu/i,
              timeout: 10000
            },
            {
              name: 'login_wrong_password',
              chat: `/login ${TEST_PASSWORD}-wrong`,
              wait: /Wrong password|Sai mật khẩu/i,
              timeout: 10000
            },
            {
              name: 'login',
              chat: `/login ${TEST_PASSWORD}`,
              wait: /Login successful|Đăng nhập thành công/i,
              timeout: 15000
            },
            {
              name: 'uuid',
              chat: '/uuid',
              wait: /[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}/i,
              timeout: 5000
            }
          ];

          let stepIndex = 0;
          let botReady = false;
          let currentStepStart = 0;
          let stepTimeout = null;
          const results = [];

          const globalTimeout = setTimeout(() => {
            console.log('❌ TIMEOUT — test did not finish in 90s');
            printResults();
            process.exit(1);
          }, 90000);

          function printResults() {
            console.log('\n========== TEST RESULTS ==========');
            results.forEach(r => {
              console.log(`${r.passed ? '✅' : '❌'} ${r.name} (${r.duration}ms)`);
            });
            const passed = results.filter(r => r.passed).length;
            console.log(`\nSCORE: ${passed}/${steps.length}`);
            console.log('==================================\n');
          }

          function failCurrentStep(reason) {
            const step = steps[stepIndex];
            if (stepTimeout) clearTimeout(stepTimeout);
            console.error('Step ' + (step ? step.name : 'unknown') + ' FAILED: ' + reason);
            if (step) results.push({ name: step.name, passed: false, duration: Date.now() - currentStepStart });
            printResults();
            try { bot.quit(); } catch (_) {}
            process.exit(1);
          }

          function sendCurrentStep() {
            const step = steps[stepIndex];
            if (!step) return;
            currentStepStart = Date.now();
            console.log('\\n[Step ' + (stepIndex + 1) + '/' + steps.length + '] Running: ' + step.name);
            // Do not log chat commands because they contain test credentials.
            bot.chat(step.chat);
            if (stepTimeout) clearTimeout(stepTimeout);
            stepTimeout = setTimeout(() => failCurrentStep('timed out after ' + step.timeout + 'ms'), step.timeout);
          }

          const bot = mineflayer.createBot({
            host: MC_HOST,
            port: MC_PORT,
            username: BOT_USERNAME,
            version: false,
            hideErrors: false
          });

          bot.on('spawn', () => {
            console.log('✅ Bot spawned');
            setTimeout(() => {
              botReady = true;
              sendCurrentStep();
            }, 3000);
          });

          bot.on('message', (msg) => {
            const text = msg.toString().trim();
            if (!text) return;
            console.log('[CHAT]', text);

            // Bỏ qua message khi bot chưa ready
            if (!botReady) return;

            const step = steps[stepIndex];
            if (!step) return;

            if (step.wait.test(text)) {
              const duration = Date.now() - currentStepStart;
              if (stepTimeout) clearTimeout(stepTimeout);
              console.log(`✅ Step "${step.name}" PASSED (${duration}ms)`);
              results.push({ name: step.name, passed: true, duration });

              stepIndex++;

              if (stepIndex >= steps.length) {
                console.log('\n✅ ALL STEPS PASSED');
                printResults();
                clearTimeout(globalTimeout);
                setTimeout(() => {
                  bot.quit();
                  process.exit(0);
                }, 1000);
              } else {
                setTimeout(sendCurrentStep, 1500);
              }
            }
          });

          bot.on('error', (err) => {
            console.error('❌ Bot error:', err.message);
          });

          bot.on('kicked', (reason) => {
            console.error('❌ Bot kicked:', reason);
          });

          bot.on('end', (reason) => {
            console.log('Bot disconnected:', reason);
            if (stepIndex < steps.length) {
              console.log(`⚠️  Only ${stepIndex}/${steps.length} steps passed`);
              printResults();
              process.exit(1);
            }
          });
          BOTEOF
          echo "✅ Bot script created"

      # ───────────────────────────────────────────────────────
      # 9. Run bot test
      # ───────────────────────────────────────────────────────
      - name: Run Mineflayer bot test
        env:
          BOT_USERNAME: ${{ inputs.bot_username || 'TestBot' }}
          TEST_PASSWORD: ${{ inputs.test_password || 'SecurePass123!' }}
        run: |
          cd test-server
          echo "::add-mask::$TEST_PASSWORD"
          set +e
          timeout 120s node bot-test.js 2>&1 | tee bot-test.log
          EXIT_CODE=${PIPESTATUS[0]}
          echo "Bot test exit code: $EXIT_CODE"
          exit "$EXIT_CODE"

      # ───────────────────────────────────────────────────────
      # 10. Upload logs (always)
      # ───────────────────────────────────────────────────────
      - name: Upload server log
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: paper-server-log
          path: test-server/server.log
          if-no-files-found: warn

      - name: Upload bot test log
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: mineflayer-test-log
          path: test-server/bot-test.log
          if-no-files-found: warn

      # ───────────────────────────────────────────────────────
      # 11. Stop server
      # ───────────────────────────────────────────────────────
      - name: Stop Paper server
        if: always()
        run: |
          cd test-server
          if [ -f server.pid ]; then
            kill $(cat server.pid) 2>/dev/null || true
            sleep 2
            kill -9 $(cat server.pid) 2>/dev/null || true
          fi
          echo "Server stopped"

      # ───────────────────────────────────────────────────────
      # 12. Summary
      # ───────────────────────────────────────────────────────
      - name: Summary
        if: always()
        env:
          MC_VERSION: ${{ inputs.mc_version || '1.21.4' }}
          BOT_USERNAME: ${{ inputs.bot_username || 'TestBot' }}
        run: |
          echo "## 🎯 E2E Mineflayer Test" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Item | Value |" >> "$GITHUB_STEP_SUMMARY"
          echo "|------|-------|" >> "$GITHUB_STEP_SUMMARY"
          echo "| Paper | $MC_VERSION |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Bot user | $BOT_USERNAME |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Java | 21 |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Node | 20 |" >> "$GITHUB_STEP_SUMMARY"
