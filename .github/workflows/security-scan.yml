name: OWASP Dependency-Check

on:
  push:
    branches: [main, master, monorepo-fix]
  pull_request:
    branches: [main, master, monorepo-fix]
  schedule:
    - cron: '23 5 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dependency-check:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          java-version: '21'
          distribution: temurin

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.4'

      - name: Check NVD API key configuration
        id: nvd-key
        env:
          NVD_API_KEY_INPUT: ${{ secrets.NVD_API_KEY }}
        shell: bash
        run: |
          if [[ -z "${NVD_API_KEY_INPUT:-}" ]]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::warning::OWASP scan NOT RUN: add the NVD_API_KEY repository secret to enable a complete vulnerability scan."
            {
              echo "### OWASP Dependency-Check"
              echo "Scan **not run** because the repository secret NVD_API_KEY is not configured."
              echo "Add an API key from https://nvd.nist.gov/developers/request-an-api-key, then rerun this workflow."
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Scan Gradle dependency graph
        if: steps.nvd-key.outputs.configured == 'true'
        env:
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
        run: gradle --no-daemon dependencyCheckAggregate

      - name: Upload OWASP Dependency-Check reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: owasp-dependency-check-reports
          path: build/reports/dependency-check/**
          if-no-files-found: warn
          retention-days: 14
