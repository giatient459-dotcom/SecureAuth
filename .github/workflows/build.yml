name: Build

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: temurin
          cache: maven
      - name: Build all modules
        run: mvn -B package --no-transfer-progress
      - name: Upload Paper JAR
        uses: actions/upload-artifact@v4
        with:
          name: SecureAuth-Paper
          path: paper/target/SecureAuth-*.jar
      - name: Upload Velocity JAR
        uses: actions/upload-artifact@v4
        with:
          name: SecureAuth-Velocity
          path: velocity/target/SecureAuthVelocity-*.jar
