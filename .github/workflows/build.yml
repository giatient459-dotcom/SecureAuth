name: Build

on:
  push:
    branches: [main, master, monorepo-fix]
  pull_request:
    branches: [main, master, monorepo-fix]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          java-version: '21'
          distribution: temurin
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.4'
      - name: Build all modules
        run: gradle --no-daemon clean build
      - name: Make scripts executable
        run: chmod +x scripts/*.sh
      - name: Verify JARs
        env:
          PROJECT_VERSION: '1.0.3'
        run: bash scripts/verify-jars.sh
      - name: Upload Paper JAR
        uses: actions/upload-artifact@v7
        with:
          name: SecureAuth-Paper
          path: paper/build/libs/SecureAuth-*.jar
          if-no-files-found: error
      - name: Upload Velocity JAR
        uses: actions/upload-artifact@v7
        with:
          name: SecureAuth-Velocity
          path: velocity/build/libs/SecureAuthVelocity-*.jar
          if-no-files-found: error
      - name: Upload BungeeCord JAR
        uses: actions/upload-artifact@v7
        with:
          name: SecureAuth-BungeeCord
          path: bungee/build/libs/SecureAuthBungee-*.jar
          if-no-files-found: error
