name: Build

on:
  push:
    branches:
      - '**'        # trigger mọi lần push bất kỳ branch
    tags:
      - 'v*'        # trigger khi push tag v1.0.0
  workflow_dispatch: # chạy thủ công từ GitHub UI

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Build with Maven
        run: mvn -B package --no-transfer-progress

      - name: Get version from pom.xml
        id: get_version
        run: |
          VERSION=$(mvn help:evaluate -Dexpression=project.version -q -DforceStdout)
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "jar=target/SecureAuth-${VERSION}.jar" >> $GITHUB_OUTPUT

      - name: Test JAR
        run: |
          JAR="${{ steps.get_version.outputs.jar }}"

          # 1. File tồn tại và không rỗng
          if [ ! -f "$JAR" ]; then
            echo "❌ JAR not found: $JAR"
            exit 1
          fi
          SIZE=$(stat -c%s "$JAR")
          echo "✅ JAR exists — size: $SIZE bytes"
          if [ "$SIZE" -lt 100000 ]; then
            echo "❌ JAR too small ($SIZE bytes) — likely a broken shade"
            exit 1
          fi

          # 2. Là file ZIP/JAR hợp lệ
          if ! unzip -t "$JAR" > /dev/null 2>&1; then
            echo "❌ JAR is not a valid zip"
            exit 1
          fi
          echo "✅ JAR is valid zip"

          # 3. plugin.yml tồn tại
          if ! unzip -p "$JAR" plugin.yml > /dev/null 2>&1; then
            echo "❌ plugin.yml missing from JAR"
            exit 1
          fi
          echo "✅ plugin.yml present"

          # 4. Main class tồn tại trong JAR
          MAIN_CLASS="dev/tienday/secureauth/SecureAuthPlugin.class"
          if ! unzip -l "$JAR" | grep -q "$MAIN_CLASS"; then
            echo "❌ Main class missing: $MAIN_CLASS"
            exit 1
          fi
          echo "✅ Main class present"

          # 5. SQLite và Argon2 đã được shade vào
          if ! unzip -l "$JAR" | grep -q "org/sqlite"; then
            echo "❌ SQLite not shaded into JAR"
            exit 1
          fi
          echo "✅ SQLite shaded"

          if ! unzip -l "$JAR" | grep -q "bouncycastle\|bcprov"; then
            echo "❌ BouncyCastle (Argon2) not shaded into JAR"
            exit 1
          fi
          echo "✅ BouncyCastle shaded"

          # 6. In plugin.yml để xác nhận version
          echo "--- plugin.yml ---"
          unzip -p "$JAR" plugin.yml
          echo "--- end ---"

          echo ""
          echo "✅ All tests passed"

      - name: Upload JAR as artifact (mọi lần build)
        uses: actions/upload-artifact@v4
        with:
          name: SecureAuth-${{ steps.get_version.outputs.version }}
          path: ${{ steps.get_version.outputs.jar }}
          retention-days: 30

      - name: Create GitHub Release (chỉ khi push tag v*)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.get_version.outputs.jar }}
          name: "SecureAuth ${{ steps.get_version.outputs.version }}"
          body: |
            ## SecureAuth ${{ steps.get_version.outputs.version }}

            ### Cài đặt
            1. Tải file `.jar` bên dưới
            2. Bỏ vào thư mục `plugins/`
            3. Cấu hình `config.yml`
            4. Khởi động server

            ### Thay đổi
            _Cập nhật changelog tại đây_
          draft: false
          prerelease: false
