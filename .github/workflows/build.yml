name: Build

on:
  push:
    branches:
      - '**'
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: write

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Build with Maven
        run: mvn -B package --no-transfer-progress

      - name: Get version from pom.xml
        id: get_version
        run: |
          VERSION=$(mvn help:evaluate -Dexpression=project.version -q -DforceStdout)
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "jar=target/SecureAuth-${VERSION}.jar" >> $GITHUB_OUTPUT

      - name: Test JAR
        run: |
          JAR="${{ steps.get_version.outputs.jar }}"

          if [ ! -f "$JAR" ]; then echo "❌ JAR not found"; exit 1; fi
          SIZE=$(stat -c%s "$JAR")
          echo "✅ JAR exists — size: $SIZE bytes"
          if [ "$SIZE" -lt 100000 ]; then echo "❌ JAR too small ($SIZE bytes)"; exit 1; fi
          if ! unzip -t "$JAR" > /dev/null 2>&1; then echo "❌ JAR invalid zip"; exit 1; fi
          if ! unzip -p "$JAR" plugin.yml > /dev/null 2>&1; then echo "❌ plugin.yml missing"; exit 1; fi
          if ! unzip -l "$JAR" | grep -q "SecureAuthPlugin.class"; then echo "❌ Main class missing"; exit 1; fi
          if ! unzip -l "$JAR" | grep -q "org/sqlite"; then echo "❌ SQLite not shaded"; exit 1; fi
          if ! unzip -l "$JAR" | grep -q "bouncycastle\|bcprov"; then echo "❌ BouncyCastle not shaded"; exit 1; fi
          echo "✅ All tests passed"

      - name: Upload JAR as artifact
        uses: actions/upload-artifact@v4
        with:
          name: SecureAuth-${{ steps.get_version.outputs.version }}
          path: ${{ steps.get_version.outputs.jar }}
          retention-days: 30

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.get_version.outputs.jar }}
          name: "SecureAuth ${{ steps.get_version.outputs.version }}"
          body: |
            ## SecureAuth ${{ steps.get_version.outputs.version }}

            ### Cài đặt
            1. Tải file `.jar` bên dưới
            2. Bỏ vào thư mục `plugins/`
            3. Cấu hình `config.yml`
            4. Khởi động server
          draft: false
          prerelease: false
