name: Build

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: temurin
          cache: maven

      - name: Build all modules
        run: mvn -B package --no-transfer-progress

      - name: Verify Paper + Velocity JARs
        run: |
          set -euo pipefail

          PAPER_JAR="paper/target/SecureAuth-1.0.2.jar"
          VEL_JAR="velocity/target/SecureAuthVelocity-1.0.2.jar"

          echo "== Locate JARs =="
          ls -la paper/target/*.jar || true
          ls -la velocity/target/*.jar || true

          test -f "$PAPER_JAR" || { echo "::error::Missing $PAPER_JAR"; exit 1; }
          test -f "$VEL_JAR"   || { echo "::error::Missing $VEL_JAR"; exit 1; }

          PAPER_SIZE=$(stat -c%s "$PAPER_JAR")
          VEL_SIZE=$(stat -c%s "$VEL_JAR")
          echo "Paper JAR size:   $PAPER_SIZE bytes"
          echo "Velocity JAR size: $VEL_SIZE bytes"

          if [ "$PAPER_SIZE" -lt 500000 ]; then
            echo "::error::Paper JAR too small ($PAPER_SIZE) — shade may have failed"
            exit 1
          fi
          if [ "$VEL_SIZE" -lt 2000 ]; then
            echo "::error::Velocity JAR too small ($VEL_SIZE)"
            exit 1
          fi

          echo "== Inspect Paper JAR =="
          jar tf "$PAPER_JAR" | grep -E '^plugin\.yml$' \
            || { echo "::error::plugin.yml missing inside Paper JAR"; exit 1; }
          jar tf "$PAPER_JAR" | grep -E 'dev/tienday/secureauth/SecureAuthPlugin\.class$' \
            || { echo "::error::SecureAuthPlugin.class missing"; exit 1; }
          jar tf "$PAPER_JAR" | grep -E 'dev/tienday/secureauth/database/DatabaseManager\.class$' \
            || { echo "::error::DatabaseManager.class missing"; exit 1; }
          jar tf "$PAPER_JAR" | grep -E 'org/sqlite/JDBC\.class$' \
            || { echo "::error::sqlite-jdbc not shaded into Paper JAR"; exit 1; }
          jar tf "$PAPER_JAR" | grep -E 'org/bouncycastle/' \
            || { echo "::error::bouncycastle not shaded into Paper JAR"; exit 1; }

          TMP=$(mktemp -d)
          unzip -p "$PAPER_JAR" plugin.yml > "$TMP/plugin.yml"
          grep -qE 'main:[[:space:]]*dev\.tienday\.secureauth\.SecureAuthPlugin' "$TMP/plugin.yml" \
            || { echo "::error::plugin.yml main class incorrect"; cat "$TMP/plugin.yml"; exit 1; }
          grep -qE 'version:' "$TMP/plugin.yml" \
            || { echo "::error::plugin.yml missing version"; exit 1; }
          echo "--- plugin.yml (head) ---"
          head -20 "$TMP/plugin.yml"

          echo "== Inspect Velocity JAR =="
          jar tf "$VEL_JAR" | grep -E 'velocity-plugin\.json$' \
            || { echo "::error::velocity-plugin.json missing"; exit 1; }
          jar tf "$VEL_JAR" | grep -E 'dev/tienday/secureauth/velocity/SecureAuthVelocity\.class$' \
            || { echo "::error::SecureAuthVelocity.class missing"; exit 1; }
          jar tf "$VEL_JAR" | grep -E 'dev/tienday/secureauth/velocity/AuthNotifyServer\.class$' \
            || { echo "::error::AuthNotifyServer.class missing"; exit 1; }

          unzip -p "$VEL_JAR" velocity-plugin.json > "$TMP/velocity-plugin.json"
          echo "--- velocity-plugin.json ---"
          cat "$TMP/velocity-plugin.json"
          echo

          # JSON may be minified (no spaces) — match flexibly
          if ! grep -qE '"id"[[:space:]]*:[[:space:]]*"secureauth-velocity"' "$TMP/velocity-plugin.json"; then
            echo "::error::velocity-plugin.json id incorrect"
            exit 1
          fi
          if ! grep -qE '"version"[[:space:]]*:[[:space:]]*"1\.0\.2"' "$TMP/velocity-plugin.json"; then
            echo "::error::velocity-plugin.json version not 1.0.2"
            exit 1
          fi
          if ! grep -qE '"main"[[:space:]]*:[[:space:]]*"dev\.tienday\.secureauth\.velocity\.SecureAuthVelocity"' "$TMP/velocity-plugin.json"; then
            echo "::error::velocity-plugin.json main class incorrect"
            exit 1
          fi

          echo "== RESULT: both JARs OK =="
          echo "PAPER=$PAPER_JAR ($PAPER_SIZE bytes)"
          echo "VELOCITY=$VEL_JAR ($VEL_SIZE bytes)"

      - name: Upload Paper JAR
        uses: actions/upload-artifact@v4
        with:
          name: SecureAuth-Paper
          path: paper/target/SecureAuth-1.0.2.jar
          if-no-files-found: error

      - name: Upload Velocity JAR
        uses: actions/upload-artifact@v4
        with:
          name: SecureAuth-Velocity
          path: velocity/target/SecureAuthVelocity-1.0.2.jar
          if-no-files-found: error
