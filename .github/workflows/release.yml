name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag must match the project version (for example v1.0.3)'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-22.04
    env:
      RELEASE_TAG_INPUT: \${{ github.event.inputs.tag }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          java-version: '21'
          distribution: temurin
          cache: maven

      - name: Build all modules
        run: mvn -B clean verify --no-transfer-progress

      - name: Resolve version and artifact paths
        id: ver
        shell: bash
        run: |
          set -euo pipefail
          PROJECT_VERSION="$(sed -n 's/.*<revision>\([^<]*\)<\/revision>.*/\1/p' pom.xml | head -n1)"
          test -n "$PROJECT_VERSION"

          PAPER_JAR="paper/target/SecureAuth-$PROJECT_VERSION.jar"
          VEL_JAR="velocity/target/SecureAuthVelocity-$PROJECT_VERSION.jar"
          BUNGEE_JAR="bungee/target/SecureAuthBungee-$PROJECT_VERSION.jar"
          test -f "$PAPER_JAR"
          test -f "$VEL_JAR"
          test -f "$BUNGEE_JAR"

          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            TAG="$(printf '%s' "$GITHUB_REF" | sed 's#^refs/tags/##')"
          else
            TAG="$RELEASE_TAG_INPUT"
            if [ -z "$TAG" ]; then
              SHORT_SHA="$(printf '%.7s' "$GITHUB_SHA")"
              TAG="v$PROJECT_VERSION-snapshot-$SHORT_SHA"
            fi
          fi

          if [[ "$TAG" != "v$PROJECT_VERSION" && "$TAG" != "v$PROJECT_VERSION-snapshot-"* ]]; then
            echo "::error::Release tag '$TAG' does not match project version $PROJECT_VERSION"
            exit 1
          fi

          echo "project_version=$PROJECT_VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "paper_jar=$PAPER_JAR" >> "$GITHUB_OUTPUT"
          echo "vel_jar=$VEL_JAR" >> "$GITHUB_OUTPUT"
          echo "bungee_jar=$BUNGEE_JAR" >> "$GITHUB_OUTPUT"
          echo "Paper=$PAPER_JAR Velocity=$VEL_JAR Bungee=$BUNGEE_JAR Tag=$TAG"

      - name: Upload build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: SecureAuth-release-jars
          path: |
            \${{ steps.ver.outputs.paper_jar }}
            \${{ steps.ver.outputs.vel_jar }}
            \${{ steps.ver.outputs.bungee_jar }}
          if-no-files-found: error

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: \${{ steps.ver.outputs.tag }}
          name: SecureAuth \${{ steps.ver.outputs.tag }}
          generate_release_notes: true
          files: |
            \${{ steps.ver.outputs.paper_jar }}
            \${{ steps.ver.outputs.vel_jar }}
            \${{ steps.ver.outputs.bungee_jar }}
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: \${{ secrets.GITHUB_TOKEN }}
