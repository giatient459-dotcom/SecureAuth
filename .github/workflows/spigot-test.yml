name: Spigot Compatibility Test

on:
  workflow_dispatch:
    inputs:
      mc_version:
        description: 'Minecraft version'
        required: true
        default: '1.21.4'

jobs:
  build-spigot:
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: temurin
          cache: maven

      - name: Cache BuildTools
        uses: actions/cache@v4
        with:
          path: .buildtools
          key: buildtools-${{ runner.os }}-${{ inputs.mc_version }}

      - name: Build plugin
        run: mvn -B clean verify --no-transfer-progress

      - name: Build Spigot
        env:
          MC_VERSION: ${{ inputs.mc_version }}
        run: |
          chmod +x scripts/buildtools.sh
          bash scripts/buildtools.sh

      - name: Debug - List Spigot files
        if: always()
        run: |
          echo "=== Search spigot jars ==="
          find .buildtools -name "spigot-*.jar" -type f 2>/dev/null || echo "not found in .buildtools"
          find . -name "spigot-*.jar" -type f 2>/dev/null | head -20 || true
          echo "=== .buildtools tree (2 levels) ==="
          find .buildtools -maxdepth 3 -type d 2>/dev/null | head -20

      - name: Upload Spigot jar
        uses: actions/upload-artifact@v4
        with:
          name: spigot-${{ inputs.mc_version }}
          path: |
            .buildtools/**/spigot-*.jar
            .buildtools/spigot-*.jar
          if-no-files-found: warn

      - name: Upload plugin
        uses: actions/upload-artifact@v4
        with:
          name: SecureAuth-Spigot-Test
          path: paper/target/SecureAuth-*.jar
          if-no-files-found: warn
