name: Gradle Build Scan (Develocity)

on:
  push:
    branches: [main, master, monorepo-fix]
  pull_request:
    branches: [main, master, monorepo-fix]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-scan:
    if: ${{ vars.DEVELOCITY_SCAN_ENABLED == 'true' && vars.DEVELOCITY_SCAN_TERMS_ACCEPTED == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          java-version: '21'
          distribution: temurin

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.4'

      - name: Build and publish Develocity Build Scan
        env:
          DEVELOCITY_SCAN_TERMS_ACCEPTED: ${{ vars.DEVELOCITY_SCAN_TERMS_ACCEPTED }}
        run: |
          set -euo pipefail
          test "$DEVELOCITY_SCAN_TERMS_ACCEPTED" = "true"
          gradle --no-daemon clean build --scan \
            -Dscan.termsOfServiceUrl=https://gradle.com/terms-of-service \
            -Dscan.termsOfServiceAgree=yes

      - name: Upload Gradle diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: gradle-build-scan-diagnostics
          path: |
            **/build/test-results/**
            **/build/reports/tests/**
          if-no-files-found: warn
